name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run verify

  integration:
    runs-on: ubuntu-latest
    # Without this the GitHub default is six hours. A required check that hangs holds a merge
    # for a working day and burns runner minutes doing nothing; failing fast is strictly better.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sermon_clipper
          POSTGRES_PASSWORD: sermon_clipper
          POSTGRES_DB: sermon_clipper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sermon_clipper -d sermon_clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sermon_clipper:sermon_clipper@localhost:5432/sermon_clipper?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      # noninteractive so a package prompt can never wait forever on a headless runner, and
      # retries so a slow apt mirror fails as a retry rather than as a stall.
      #
      # The retries handle a mirror that answers slowly. They do not help one that stops
      # answering: apt then sits on an open connection, and with no limit here the check ran to
      # the job's own 30-minute cap before anyone could re-run it. Five minutes is far longer
      # than this install has ever legitimately taken and turns that stall into a fast retry.
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3
          sudo -E apt-get install -y -o Acquire::Retries=3 ffmpeg
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sermon_clipper
          POSTGRES_PASSWORD: sermon_clipper
          POSTGRES_DB: sermon_clipper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sermon_clipper -d sermon_clipper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sermon_clipper:sermon_clipper@localhost:5432/sermon_clipper?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      # noninteractive so a package prompt can never wait forever on a headless runner, and
      # retries so a slow apt mirror fails as a retry rather than as a stall.
      #
      # The retries handle a mirror that answers slowly. They do not help one that stops
      # answering: apt then sits on an open connection, and with no limit here the check ran to
      # the job's own 30-minute cap before anyone could re-run it. Five minutes is far longer
      # than this install has ever legitimately taken and turns that stall into a fast retry.
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -o Acquire::Retries=3
          sudo -E apt-get install -y -o Acquire::Retries=3 ffmpeg
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      # Built here rather than inside the Playwright web server, so a build failure is reported as
      # a build failure instead of as a web server that never answered.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Guards against lockfile drift that only breaks under Linux npm (macOS installs can drop
  # platform-specific optional deps) and against Dockerfile regressions — the worker image is
  # the production runtime for transcription and rendering.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
